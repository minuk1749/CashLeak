name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 타입 검사 · 테스트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  database:
    name: Supabase 스키마 · 행 수준 보안
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 마이그레이션 적용 후 RLS 시험
        working-directory: supabase/tests
        run: psql -d postgres -v ON_ERROR_STOP=1 -q -f auth-stub.sql -f ../migrations/0001_init.sql -f rls.test.sql
      - name: 저장소 왕복 시험 (실제 PostgreSQL)
        run: npm test -w @cashleak/web
